<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zendex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky account bar, two-panel lobby (create | join), logo + prompt bar, workspace with members rail, preview and prompt bar. */
:root{
  --bg:#f4f1fb;--bg2:#ebe6f7;--panel:#ffffff;--panel2:#f6f2fd;--ink:#120d22;--muted:#5b5372;--line:#d9d1ee;
  --accent:#6d28d9;--accent-ink:#ffffff;--accent-soft:#eadfff;--good:#15803d;--bad:#c0262d;--warn:#a15c07;
  --rain:#6d28d9;--shadow:0 12px 32px rgba(45,20,100,.14);--logo-fill:#0a0612;--logo-line:#ffffff;--logo-glitch:#8b5cf6;
  --f-display:'Chakra Petch',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09060f;--bg2:#0f0a1a;--panel:#130d22;--panel2:#1a1230;--ink:#f1ecff;--muted:#a99fc6;--line:#2d2249;
  --accent:#9b6bff;--accent-ink:#0a0612;--accent-soft:#271b49;--good:#4ade80;--bad:#ff6b73;--warn:#fbbf24;
  --rain:#9b6bff;--shadow:0 12px 32px rgba(0,0,0,.5);--logo-fill:#05030a;--logo-line:#ffffff;--logo-glitch:#a78bfa;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09060f;--bg2:#0f0a1a;--panel:#130d22;--panel2:#1a1230;--ink:#f1ecff;--muted:#a99fc6;--line:#2d2249;
  --accent:#9b6bff;--accent-ink:#0a0612;--accent-soft:#271b49;--good:#4ade80;--bad:#ff6b73;--warn:#fbbf24;
  --rain:#9b6bff;--shadow:0 12px 32px rgba(0,0,0,.5);--logo-fill:#05030a;--logo-line:#ffffff;--logo-glitch:#a78bfa;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);overflow-x:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.wrap{width:min(1120px,100%);margin-inline:auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.01em}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* wordmark + logo glitch */
.wordmark{position:relative;display:inline-block;font:700 1.35rem/1 var(--f-display);letter-spacing:.22em;color:var(--ink)}
.wordmark::before,.wordmark::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
.wordmark::before{color:var(--logo-glitch);animation:gl1 4.2s infinite steps(1)}
.wordmark::after{color:var(--ink);opacity:.7;animation:gl2 3.6s infinite steps(1)}
.wordmark.big{font-size:clamp(2rem,6vw,3.2rem)}
@keyframes gl1{0%,88%,100%{clip-path:inset(0 0 100% 0);transform:none}90%{clip-path:inset(10% 0 55% 0);transform:translate(-3px,0)}93%{clip-path:inset(60% 0 8% 0);transform:translate(3px,0)}96%{clip-path:inset(30% 0 40% 0);transform:translate(-2px,0)}}
@keyframes gl2{0%,70%,100%{clip-path:inset(0 0 100% 0);transform:none}72%{clip-path:inset(40% 0 30% 0);transform:translate(3px,1px)}75%{clip-path:inset(5% 0 80% 0);transform:translate(-3px,0)}}
.zlogo{display:block;overflow:visible}
.zlogo .gA,.zlogo .gB{animation:zg1 5s infinite steps(1)}
.zlogo .gB{animation-name:zg2;animation-duration:4.4s}
@keyframes zg1{0%,86%,100%{clip-path:inset(0 0 100% 0);transform:none}88%{clip-path:inset(12% 0 58% 0);transform:translate(-8px,0)}91%{clip-path:inset(58% 0 12% 0);transform:translate(7px,0)}94%{clip-path:inset(32% 0 38% 0);transform:translate(-4px,0)}}
@keyframes zg2{0%,76%,100%{clip-path:inset(0 0 100% 0);transform:none}78%{clip-path:inset(45% 0 25% 0);transform:translate(6px,1px)}81%{clip-path:inset(8% 0 78% 0);transform:translate(-6px,-1px)}}
.zlogo .node{animation:pulse 2.8s infinite ease-in-out}
@keyframes pulse{50%{opacity:.35}}
body.noglitch .wordmark::before,body.noglitch .wordmark::after,body.noglitch .zlogo .gA,body.noglitch .zlogo .gB,body.noglitch .zlogo .node{animation:none}
body.noglitch .zlogo .gA,body.noglitch .zlogo .gB{clip-path:inset(0 0 100% 0)}
@media (prefers-reduced-motion:reduce){.wordmark::before,.wordmark::after,.zlogo .gA,.zlogo .gB,.zlogo .node{animation:none}.zlogo .gA,.zlogo .gB{clip-path:inset(0 0 100% 0)}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.welcome{flex:1;min-width:0;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.welcome strong{font:600 1.05rem var(--f-display)}
.clock{font:500 .82rem var(--f-mono);color:var(--muted)}
.pill{font:600 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.live{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .95rem var(--f-display);flex:none;border:2px solid var(--line)}
.avatar.sm{width:26px;height:26px;font-size:.78rem}
.avatar.btn-av{border:2px solid var(--accent);padding:0}
.bar2 .wrap{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);position:relative}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn svg{width:19px;height:19px}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:600 .65rem/17px var(--f-mono);text-align:center;padding:0 4px}
.tabs{display:flex;gap:4px;margin-inline:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:none;padding:8px 16px;border-radius:9px;font:600 .92rem var(--f-display);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.menu{position:absolute;right:16px;top:calc(100% - 2px);width:min(300px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:30}
.menu h4{margin:8px 10px 4px;font:600 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;text-align:left}
.mi:hover{background:var(--panel2)}
.mi svg{width:17px;height:17px;flex:none}
.mi .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi[aria-current="true"]{background:var(--accent-soft)}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.sm{padding:5px 11px;font-size:.84rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label,.lbl{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.err{color:var(--bad);font-size:.88rem;min-height:1.3em;margin:4px 0}
.ok{color:var(--good)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.tog{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .15s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"]::after{transform:translateX(18px);background:var(--accent-ink)}

/* auth */
.auth{flex:1;display:grid;place-items:center;padding-block:32px}
.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.authcard{width:min(420px,100%);text-align:center}
.authcard form{text-align:left}
.slogan{font:500 .95rem var(--f-mono);color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin:8px 0 18px}
.authtabs{display:flex;margin-bottom:16px}
.authtabs .seg{width:100%}
.authtabs .seg button{flex:1}
.hint{font-size:.82rem;color:var(--muted)}

/* lobby */
.lobby{padding-block:24px 8px;display:grid;gap:20px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{display:grid;gap:12px;align-content:start}
.panel h2{font-size:1.2rem}
.members{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:6px;display:grid;gap:2px;max-height:210px;overflow:auto}
.mem{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.mem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:600 .65rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.adm{background:var(--accent);color:var(--accent-ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tag.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.status{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.status.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.orline{display:flex;align-items:center;gap:12px;color:var(--muted);font:600 .75rem var(--f-mono)}
.orline::before,.orline::after{content:"";height:1px;background:var(--line);flex:1}
.slist{display:grid;gap:6px;max-height:260px;overflow:auto}
.srv{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.hero-z{display:grid;justify-items:center;gap:6px;padding-block:8px 0;text-align:center}
.promptbar{display:flex;gap:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:6px;box-shadow:var(--shadow)}
.promptbar input{border:0;background:none;outline:0!important;flex:1;min-width:0;padding:10px 12px}
.promptbar .go{width:44px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.promptbar .go svg{width:20px;height:20px}
.foot{margin-top:auto;border-top:1px solid var(--line);padding-block:16px;font-size:.84rem;color:var(--muted)}
.foot .wrap{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.foot .em{font-family:var(--f-mono);font-size:.78rem;color:var(--ink);user-select:all}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline}
.banner{background:var(--accent-soft);border-bottom:1px solid var(--line);padding:9px 16px;font-size:.9rem;display:flex;gap:12px;align-items:center;justify-content:center;text-align:center}

/* workspace */
.ws{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding-block:16px;min-height:0}
.rail{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.rail h3{overflow-wrap:anywhere}
[hidden]{display:none!important}
.rail .card{padding:14px}
.rail h3{font-size:.95rem;margin-bottom:8px}
.hist{display:grid;gap:8px;max-height:300px;overflow:auto}
.hist div{font-size:.85rem;border-left:2px solid var(--accent);padding-left:8px}
.hist small{display:block;color:var(--muted);font:.7rem var(--f-mono)}
.stage{display:grid;grid-template-rows:auto minmax(380px,1fr) auto;gap:12px;min-width:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .hint{white-space:nowrap;text-align:right}
.view{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;display:grid;place-items:stretch;min-height:380px;position:relative}
.view iframe{width:100%;height:100%;border:0;background:#fff;min-height:380px}
.view.phone{place-items:center;background:var(--panel2)}
.view.phone iframe{width:390px;max-width:100%;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.view textarea{height:100%;min-height:380px;border:0;border-radius:0;font:12.5px/1.55 var(--f-mono);resize:none}
.building{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 78%,transparent);display:grid;place-items:center;text-align:center;gap:10px;z-index:3}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(1turn)}}
.empty{display:grid;place-items:center;text-align:center;padding:30px;gap:8px;color:var(--muted)}

/* modal + toasts */
.mback{position:fixed;inset:0;z-index:60;background:rgba(6,3,14,.62);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.modal.narrow{width:min(480px,100%)}
.modal.wide{width:min(1040px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.mh h2{flex:1;font-size:1.15rem}
.mb{padding:18px}
.tabsm{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.tabsm .tab{border:1px solid var(--line)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:80;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;font-weight:500;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel2)}
tr:last-child td{border:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2)}
.stat b{display:block;font:700 1.7rem var(--f-display)}
.stat span{font:600 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:14px 16px;line-height:1.7}
.note p{margin:0 0 10px}
.note p:last-child{margin:0}
.dated{font:600 .75rem var(--f-mono);color:var(--accent)}
.banwrap{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;padding:10px;background:var(--panel2);border-radius:10px;margin:6px 0}

/* profile, websites, admin extras */
.avatar{background-repeat:no-repeat}
.frame-ring{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.frame-sq{border-radius:10px}
.frame-glitch{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent);animation:fg 2.4s infinite steps(1)}
@keyframes fg{0%,80%,100%{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}84%{box-shadow:3px 0 0 2px var(--accent),-3px 0 0 4px var(--ink)}90%{box-shadow:-3px 0 0 2px var(--ink),3px 0 0 4px var(--accent)}}
body.noglitch .frame-glitch{animation:none}
.avatar.xl{width:84px;height:84px;font-size:2rem;border:4px solid var(--panel2)}
.pcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2)}
.pbanner{height:92px}
.pbody{padding:0 16px 16px}
.pbody .avatar.xl{margin-top:-42px}
.pbody h3{font-size:1.2rem;margin:8px 0 2px}
.pgrid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.sw.bn{border-radius:8px;width:44px}
input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.site{display:grid;gap:10px;align-content:start}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#fff}
.thumb iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.85rem;background:var(--panel2)}
.site h3{font-size:1.02rem;overflow-wrap:anywhere}
.site .row{flex-wrap:wrap}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--accent-soft);border-radius:10px;margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:160px}
.toolbar select{width:auto}
.sect{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel2)}
.sect h4{margin:0 0 10px;font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.log{display:grid;gap:6px;max-height:420px;overflow:auto}
.log div{font-size:.88rem;padding:6px 10px;border-left:2px solid var(--accent);background:var(--panel2);border-radius:0 8px 8px 0}
.log small{color:var(--muted);font-family:var(--f-mono)}
.prevframe{width:100%;height:min(70vh,640px);border:1px solid var(--line);border-radius:10px;background:#fff}
td .row{flex-wrap:nowrap}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}}

/* live cursors */
#cursors,#selfTag{position:fixed;left:0;top:0;pointer-events:none;z-index:95}
.rc{position:fixed;left:0;top:0;transition:transform .09s linear}
.rc svg{width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
